name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One JDK failing should not hide the result of the other.
      fail-fast: false
      matrix:
        jdk: ['21', '25']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      # target/ is deliberately not cached. The kernel render has to happen
      # from scratch every run: a stale target/classes silently satisfies
      # (require 'shen), which is exactly how a broken build once passed.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-

      # Renders shen/klambda/*.kl into target/generated on the way through.
      - name: Clojure tests
        run: clojure -M:test

      # `yes` answers the harness's "failed; continue?" prompt, so a failure is
      # reported in full rather than stopping at the first one. Without
      # pipefail bash reports the last command's status, which is the one we
      # want here.
      - name: Shen kernel suite
        run: yes | clojure -M:shen-test

      - name: Shen extension suite
        run: yes | clojure -M:shen-ext-test

  aot:
    name: AOT build and standalone jar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-

      - name: Build standalone jar
        run: clojure -T:build uber

      # Worth running twice: target/classes now shadows target/generated, so
      # these exercise the compiled kernel rather than the source one. AOT has
      # its own failure mode -- two Shen names that differ only by `.` versus
      # `_` used to munge onto a single class file, silently discarding one of
      # the two functions.
      - name: Shen kernel suite against compiled classes
        run: yes | clojure -M:shen-test

      - name: Shen extension suite against compiled classes
        run: yes | clojure -M:shen-ext-test

      # The jar should work as a script runner: evaluate stdin, then exit at
      # EOF. `timeout` and the size check guard the regression where EOF left
      # the REPL prompting against a closed stream, spinning out ~4MB/s of
      # "error: empty stream" rather than terminating.
      - name: Smoke-test the jar
        timeout-minutes: 5
        run: |
          jar=$(ls target/shen.clj-*-standalone.jar)
          printf '(* 6 7)\n' | timeout 120 java -Xss16m -jar "$jar" > repl.txt
          cat repl.txt
          grep -qx '(0-) 42' repl.txt || { echo "::error::jar did not evaluate (* 6 7)"; exit 1; }
          size=$(wc -c < repl.txt)
          [ "$size" -lt 10000 ] || { echo "::error::REPL flooded $size bytes at EOF"; exit 1; }
