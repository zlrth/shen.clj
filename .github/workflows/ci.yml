name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One JDK failing should not hide the result of the other.
      fail-fast: false
      matrix:
        jdk: ['21', '25']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      # target/ is deliberately not cached. The kernel render has to happen
      # from scratch every run: a stale target/classes silently satisfies
      # (require 'shen), which is exactly how a broken build once passed.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-

      - run: mkdir -p logs

      # Every suite is teed to logs/, which the summary step turns into a table
      # and the artifact step keeps. `shell: bash` is what adds pipefail, so a
      # failing suite is not masked by tee's exit status.
      #
      # Renders shen/klambda/*.kl into target/generated on the way through.
      - name: Clojure tests
        shell: bash
        run: clojure -M:test 2>&1 | tee logs/clojure.log

      # `yes` answers the harness's "failed; continue?" prompt, so a failure is
      # reported in full rather than stopping at the first one. It is fed in by
      # redirect rather than a pipe: as a pipeline stage it would be killed by
      # SIGPIPE at exit, and pipefail would read that as the step failing.
      - name: Shen kernel suite
        shell: bash
        run: clojure -M:shen-test < <(yes) | tee logs/kernel.log

      - name: Shen extension suite
        shell: bash
        run: clojure -M:shen-ext-test < <(yes) | tee logs/extensions.log

      # always(), so a run that fails still says how far it got.
      - name: Summarise results
        if: always()
        shell: bash
        run: .github/ci-summary.sh "Tests — JDK ${{ matrix.jdk }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-jdk${{ matrix.jdk }}
          path: logs/
          retention-days: 30

  aot:
    name: AOT build and standalone jar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-

      - run: mkdir -p logs

      - name: Build standalone jar
        run: clojure -T:build uber

      # Worth running twice: target/classes now shadows target/generated, so
      # these exercise the compiled kernel rather than the source one. AOT has
      # its own failure mode -- two Shen names that differ only by `.` versus
      # `_` used to munge onto a single class file, silently discarding one of
      # the two functions.
      - name: Shen kernel suite against compiled classes
        shell: bash
        run: clojure -M:shen-test < <(yes) | tee logs/kernel.log

      - name: Shen extension suite against compiled classes
        shell: bash
        run: clojure -M:shen-ext-test < <(yes) | tee logs/extensions.log

      # The jar should work as a script runner: evaluate stdin, then exit at
      # EOF. `timeout` and the size check guard the regression where EOF left
      # the REPL prompting against a closed stream, spinning out ~4MB/s of
      # "error: empty stream" rather than terminating.
      - name: Smoke-test the jar
        timeout-minutes: 5
        run: |
          jar=$(ls target/shen.clj-*-standalone.jar)
          printf '(* 6 7)\n' | timeout 120 java -Xss16m -jar "$jar" > logs/repl.txt
          cat logs/repl.txt
          grep -qx '(0-) 42' logs/repl.txt || { echo "::error::jar did not evaluate (* 6 7)"; exit 1; }
          size=$(wc -c < logs/repl.txt)
          [ "$size" -lt 10000 ] || { echo "::error::REPL flooded $size bytes at EOF"; exit 1; }

      - name: Summarise results
        if: always()
        shell: bash
        run: .github/ci-summary.sh "AOT — compiled kernel"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-aot
          path: logs/
          retention-days: 30
